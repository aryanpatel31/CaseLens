<!DOCTYPE html>
<html>
<head>
    <title>CaseLens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>CaseLens</h1>
    <div class="subtitle">AI-assisted evidence organization for security clearance review — decision support only, not decision-making.</div>

    <textarea id="caseText" rows="10" placeholder="Paste case file text here..."></textarea>
    <br>
    <button onclick="analyze()" id="analyzeBtn">Analyze Case</button>
    <div id="loading">Analyzing case file...</div>

    <div id="dashboard"></div>
    <div id="caseViewer"></div>

    <div id="chatSection" style="display:none;">
        <h3>Ask about this case</h3>
        <input type="text" id="chatQuestion" placeholder="e.g., What is the total delinquent debt?" style="width: 60%; padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
        <button onclick="askQuestion()">Ask</button>
        <div id="chatHistory"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
